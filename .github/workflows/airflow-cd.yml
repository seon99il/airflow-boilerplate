name: airflow-cd

on:
  push:
    branches: [ dev ]
    paths:
      - 'docker/airflow/**'
      - 'dags/**'
      - 'plugins/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy DAGs & plugins
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Sync DAGs (mock)
        run: echo "aws s3 sync dags/ s3://\$AIRFLOW_BUCKET/dags/ --delete --exclude '*__pycache__*'"

      - name: Sync plugins (mock)
        run: echo "aws s3 sync plugins/ s3://\$AIRFLOW_BUCKET/plugins/ --delete"


      - name: Detect dependency change
        id: deps
        run: |
          git diff --quiet '${{ github.event.before }}' '${{ github.sha }}' -- pyproject.toml \
            && echo 'changed=false' >> "$GITHUB_OUTPUT" \
            || echo 'changed=true' >> "$GITHUB_OUTPUT"


      - name: Resolve image tag pushed by airflow-ci
        id: img
        if: steps.deps.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[0].head.sha // empty')
          : "${sha:?no PR for $GITHUB_SHA. dev 로 직접 푸시했으면 airflow-ci 가 돈 적이 없다}"
          echo "tag=$sha" >> "$GITHUB_OUTPUT"


      - name: Roll airflow onto new image (mock)
        if: steps.deps.outputs.changed == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}/airflow:${{ steps.img.outputs.tag }}
        run: |
          echo "pyproject.toml 변경됨 → airflow 컨테이너 교체 필요 (다운타임 발생)"
          echo "  배포 대상 이미지: $IMAGE"
          echo "  compose 면 up -d --force-recreate / MWAA 면 update-environment → 롤링 수 분"

      - name: Skip airflow image roll
        if: steps.deps.outputs.changed != 'true'
        run: echo "의존성 변경 없음 → 컨테이너 그대로, 복사한 DAG 는 dag-processor 가 스캔해서 반영"
