name: worker-ci

on:
  pull_request:
    branches: [dev]
    paths:
      - 'docker/worker/**'
      - 'src/**'
      - 'pyproject.toml'

jobs:
  build:
    name: Build & push worker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to GHCR
        run: echo '${{ secrets.GITHUB_TOKEN }}' |
          docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      # PR 에서도 푸시한다. 머지 전에 이 태그로 DAG 를 실제로 돌려볼 수 있어야 한다.
      # fork PR 은 GITHUB_TOKEN 이 read-only 라 여기서 실패한다 (그때는 PUSH=0 으로)
      - name: Build & push
        id: build
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          TAG: ${{ github.event.pull_request.head.sha }}
          PUSH: '1'
        run: ./docker/worker/build.sh default

      - name: Report image tag
        run: |
          echo "### worker image" >> "$GITHUB_STEP_SUMMARY"
          echo "Airflow Variable \`worker_image_tag\` 를 아래로 바꾸면 이 PR 코드로 DAG 가 돈다:" \
            >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.build.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
